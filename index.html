<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мои финансы</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Главный экран -->
    <div id="screen-home" class="screen active">
        <div class="balance" id="balanceDisplay">
            <span id="balanceValue">0</span> ₽
        </div>

        <div class="month-summary">
            <div class="summary-item income-bg">
                <span>Доходы</span>
                <span id="monthIncome">0</span> ₽
            </div>
            <div class="summary-item expense-bg">
                <span>Расходы</span>
                <span id="monthExpense">0</span> ₽
            </div>
        </div>

        <!-- Новый порядок: Расходы (выше), Счета (центр), Доходы (ниже) -->
        <h3 class="section-title">Расходы <button class="icon-btn" data-add="expense-category">+</button></h3>
        <div class="category-grid" id="expenseCategories"></div>

        <h3 class="section-title">Счета <button class="icon-btn" data-add="account">+</button></h3>
        <div class="accounts-row" id="accountsList"></div>

        <h3 class="section-title">Доходы <button class="icon-btn" data-add="income-category">+</button></h3>
        <div class="category-grid" id="incomeCategories"></div>
    </div>

    <!-- Остальные экраны -->
    <div id="screen-history" class="screen"><h2>История</h2><p>Здесь будет история операций</p></div>
    <div id="screen-analytics" class="screen"><h2>Аналитика</h2><p>Здесь будут графики</p></div>
    <div id="screen-settings" class="screen"><h2>Настройки</h2><p>Здесь можно будет всё настроить</p></div>

    <!-- Тач-бар как на iPhone -->
    <div class="tab-bar">
        <button class="tab active" data-screen="home">🏠</button>
        <button class="tab" data-screen="history">📋</button>
        <button class="tab" data-screen="analytics">📊</button>
        <button class="tab" data-screen="settings">⚙️</button>
    </div>

    <!-- Модальное окно транзакции -->
    <div class="modal" id="transactionModal">
        <div class="modal-content">
            <h3 id="modalTitle">Новая операция</h3>
            <input type="number" id="modalAmount" placeholder="0.00" step="0.01" min="0.01">
            <input type="date" id="modalDate">
            <div class="modal-buttons">
                <button id="modalAdd">Добавить</button>
                <button id="modalCancel">Отмена</button>
            </div>
        </div>
    </div>

    <!-- Drag-клон -->
    <div id="dragClone"></div>

    <!-- Модальное окно редактирования элемента -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <h3 id="editModalTitle">Редактировать</h3>
            <input type="text" id="editName" placeholder="Название">
            <input type="text" id="editIcon" placeholder="Эмодзи" maxlength="2" style="font-size:24px; text-align:center;">
            <div class="modal-buttons">
                <button id="editSave">Сохранить</button>
                <button id="editDelete" class="danger-btn">Удалить</button>
                <button id="editCancel">Отмена</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно выбора эмодзи -->
    <div class="modal" id="emojiModal">
        <div class="modal-content emoji-picker-content">
            <h3>Выберите иконку</h3>
            <div id="emojiGrid" class="emoji-grid"></div>
            <button id="emojiCancel" style="margin-top:12px;">Отмена</button>
        </div>
        <input type="hidden" id="emojiTarget" />
    </div>

    <!-- Скрипты -->
    <script src="storage.js"></script>
    <script src="data.js"></script>
    <script src="ui.js"></script>
    <script src="dragdrop.js"></script>
    <script src="modal.js"></script>
    <script src="emoji-picker.js"></script>
    <script src="edit.js"></script>
    <script src="app.js"></script>
</body>
</html>
