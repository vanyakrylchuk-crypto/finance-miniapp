<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мои финансы</title>
    <style>
        /* Простой, но уютный дизайн в стиле Telegram */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #222222);
            margin: 0;
            padding: 16px;
            transition: background 0.3s, color 0.3s;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            font-size: 22px;
            margin-bottom: 12px;
        }
        .balance {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: bold;
        }
        .balance span {
            color: #31b545;
        }
        .negative {
            color: #d93939 !important;
        }
        label {
            display: block;
            margin-top: 12px;
            font-size: 14px;
            font-weight: 500;
        }
        input, select, button {
            width: 100%;
            padding: 12px;
            margin-top: 4px;
            border-radius: 10px;
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            font-size: 16px;
            box-sizing: border-box;
            background: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #222);
        }
        .type-switch {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }
        .type-switch button {
            flex: 1;
            background: var(--tg-theme-secondary-bg-color, #eee);
            border: 2px solid transparent;
            font-weight: 600;
            transition: 0.2s;
        }
        .type-switch button.active {
            border-color: #2ea6ff;
            background: #e6f3ff;
        }
        .add-btn {
            background: #2ea6ff;
            color: white;
            font-weight: bold;
            margin-top: 16px;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .add-btn:active {
            opacity: 0.8;
        }
        ul {
            list-style: none;
            padding: 0;
            margin-top: 24px;
        }
        li {
            background: var(--tg-theme-secondary-bg-color, #f9f9f9);
            margin-bottom: 8px;
            padding: 12px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
        }
        .income-item {
            border-left: 4px solid #31b545;
        }
        .expense-item {
            border-left: 4px solid #d93939;
        }
        .item-info {
            display: flex;
            flex-direction: column;
        }
        .item-category {
            font-size: 12px;
            color: var(--tg-theme-hint-color, #888);
        }
        .item-amount {
            font-weight: bold;
        }
        .delete-btn {
            background: none;
            border: none;
            color: #d93939;
            font-size: 20px;
            cursor: pointer;
            padding: 0 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 Мои финансы</h1>
        <div class="balance" id="balanceDisplay">Баланс: <span id="balanceValue">0</span> ₽</div>

        <label>Сумма</label>
        <input type="number" id="amountInput" placeholder="0.00" step="0.01" min="0.01" required>

        <label>Тип операции</label>
        <div class="type-switch">
            <button id="expenseBtn" class="active">Расход</button>
            <button id="incomeBtn">Доход</button>
        </div>

        <label>Категория</label>
        <select id="categorySelect"></select>

        <button class="add-btn" id="addBtn">➕ Добавить запись</button>

        <ul id="transactionsList"></ul>
    </div>

    <script>
        // Объект для хранения состояния приложения
        const state = {
            type: 'expense', // 'expense' или 'income'
            transactions: JSON.parse(localStorage.getItem('financeTransactions')) || []
        };

        // Категории для расходов и доходов
        const categories = {
            expense: ['🍔 Еда', '🚌 Транспорт', '🎉 Развлечения', '🏠 Жильё', '📚 Образование', '💊 Здоровье', '🛒 Прочее'],
            income: ['💰 Зарплата', '🎁 Подарок', '📈 Инвестиции', '💼 Фриланс', '🔄 Возврат', '📌 Другое']
        };

        // Элементы DOM
        const amountInput = document.getElementById('amountInput');
        const expenseBtn = document.getElementById('expenseBtn');
        const incomeBtn = document.getElementById('incomeBtn');
        const categorySelect = document.getElementById('categorySelect');
        const addBtn = document.getElementById('addBtn');
        const transactionsList = document.getElementById('transactionsList');
        const balanceValue = document.getElementById('balanceValue');

        // Инициализация категорий в зависимости от типа
        function updateCategories() {
            const catList = categories[state.type];
            categorySelect.innerHTML = '';
            catList.forEach(cat => {
                const option = document.createElement('option');
                option.value = cat;
                option.textContent = cat;
                categorySelect.appendChild(option);
            });
        }

        // Переключение типа операции (расход/доход)
        function setType(type) {
            state.type = type;
            if (type === 'expense') {
                expenseBtn.classList.add('active');
                incomeBtn.classList.remove('active');
            } else {
                incomeBtn.classList.add('active');
                expenseBtn.classList.remove('active');
            }
            updateCategories();
        }

        // Сохранение в localStorage
        function saveTransactions() {
            localStorage.setItem('financeTransactions', JSON.stringify(state.transactions));
        }

        // Расчёт баланса
        function calculateBalance() {
            return state.transactions.reduce((total, t) => {
                return t.type === 'income' ? total + t.amount : total - t.amount;
            }, 0);
        }

        // Отображение списка записей и баланса
        function render() {
            transactionsList.innerHTML = '';
            state.transactions.slice().reverse().forEach((t, index) => {
                const li = document.createElement('li');
                li.className = t.type === 'income' ? 'income-item' : 'expense-item';
                li.innerHTML = `
                    <div class="item-info">
                        <span>${t.category}</span>
                        <span class="item-category">${new Date(t.date).toLocaleString('ru-RU')}</span>
                    </div>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <span class="item-amount" style="color:${t.type==='income'?'#31b545':'#d93939'}">
                            ${t.type === 'income' ? '+' : '-'}${t.amount.toFixed(2)} ₽
                        </span>
                        <button class="delete-btn" data-id="${index}" title="Удалить">✕</button>
                    </div>
                `;
                transactionsList.appendChild(li);
            });

            // Обновление баланса
            const balance = calculateBalance();
            balanceValue.textContent = balance.toFixed(2);
            if (balance < 0) {
                balanceValue.classList.add('negative');
            } else {
                balanceValue.classList.remove('negative');
            }

            // Привязка кнопок удаления
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const idx = parseInt(e.target.dataset.id);
                    // idx от reversed, нужно пересчитать в реальный индекс
                    const realIndex = state.transactions.length - 1 - idx;
                    state.transactions.splice(realIndex, 1);
                    saveTransactions();
                    render();
                });
            });
        }

        // Добавление новой записи
        function addTransaction() {
            const amount = parseFloat(amountInput.value);
            if (!amount || amount <= 0) {
                alert('Введите корректную сумму');
                return;
            }

            const category = categorySelect.value;
            state.transactions.push({
                type: state.type,
                amount: amount,
                category: category,
                date: new Date().toISOString()
            });

            saveTransactions();
            amountInput.value = '';
            render();
        }

        // Обработчики событий
        expenseBtn.addEventListener('click', () => setType('expense'));
        incomeBtn.addEventListener('click', () => setType('income'));
        addBtn.addEventListener('click', addTransaction);
        // Добавление по Enter в поле суммы
        amountInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addTransaction();
            }
        });

        // Инициализация
        setType('expense');
        render();
    </script>
</body>
</html>
