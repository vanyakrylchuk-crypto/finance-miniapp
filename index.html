<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мои финансы</title>
    <!-- Подключаем стили -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>💰 Мои финансы</h1>
        <div class="balance" id="balanceDisplay">Баланс: <span id="balanceValue">0</span> ₽</div>

        <label>Сумма</label>
        <input type="number" id="amountInput" placeholder="0.00" step="0.01" min="0.01">

        <label>Тип операции</label>
        <div class="type-switch">
            <button id="expenseBtn" class="active">Расход</button>
            <button id="incomeBtn">Доход</button>
        </div>

        <label>Категория</label>
        <select id="categorySelect"></select>

        <button class="add-btn" id="addBtn">➕ Добавить запись</button>

        <ul id="transactionsList"></ul>
    </div>

    <!-- Основной скрипт приложения -->
    <script src="script.js"></script>
</body>
</html>
